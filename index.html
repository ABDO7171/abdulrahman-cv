    <!-- Google Analytics & Short Text Location Modal -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WT6S3LZ00H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WT6S3LZ00H');

      let locationGranted = false;

      function showModal() {
        if (!locationGranted) {
          let modal = document.getElementById('center-location-modal');
          if (modal) modal.style.display = 'flex';
        }
      }

      function dismissModal() {
        let modal = document.getElementById('center-location-modal');
        if (modal) modal.style.display = 'none';

        setTimeout(showModal, 8000);
      }

      function approveAndRequestLocation() {
        let modal = document.getElementById('center-location-modal');
        if (modal) modal.style.display = 'none';

        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              locationGranted = true;
              let lat = position.coords.latitude;
              let lon = position.coords.longitude;
              let coordsText = lat.toFixed(5) + ',' + lon.toFixed(5);

              fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)
                .then(res => res.json())
                .then(data => {
                  let area = data.locality || data.city || data.principalSubdivision || "Unknown Area";
                  gtag('event', 'visitor_precise_location', {
                    'district_name': area + ' (' + coordsText + ')'
                  });
                })
                .catch(err => {
                  gtag('event', 'visitor_precise_location', {
                    'district_name': 'Location (' + coordsText + ')'
                  });
                });
            },
            function(error) {
              gtag('event', 'visitor_precise_location', {
                'district_name': 'Permission Denied (Error: ' + error.code + ')'
              });
              setTimeout(showModal, 10000);
            }
          );
        }
      }
    </script>

    <!-- Direct Telegram Message Section -->

        <form id="telegramForm" style="display: flex; flex-direction: column; gap: 14px;">
          <input type="text" id="senderName" placeholder="اسمك أو وسيلة تواصل (اختياري)" style="padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#4834d4'" onblur="this.style.borderColor='#cbd5e1'">
          
          <textarea id="senderMsg" required rows="4" placeholder="اكتب رسالتك هنا..." style="padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; resize: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#4834d4'" onblur="this.style.borderColor='#cbd5e1'"></textarea>
          
          <button type="submit" id="submitBtn" style="background: #4834d4; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease;">
            إرسال الرسالة 🚀
          </button>
        </form>

        <div id="statusMsg" style="margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 500; display: none;"></div>
      </div>
    </section>

    <script>
      document.getElementById('telegramForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const token = '8739153522:AAE9GM0V-rYwe75GheGKKiAp6UQ4ytFAFQk';
        const chatId = '7831962780';
        
        const nameInput = document.getElementById('senderName').value.trim();
        const name = nameInput !== '' ? nameInput : 'مجهول (لم يحدد اسمه)';
        const msg = document.getElementById('senderMsg').value.trim();
        
        const status = document.getElementById('statusMsg');
        const btn = document.getElementById('submitBtn');
        
        btn.disabled = true;
        btn.innerText = 'جاري الإرسال...';
        btn.style.opacity = '0.7';

        const text = `📬 *رسالة جديدة من الموقع*:\n\n👤 *الراسل:* ${name}\n💬 *الرسالة:* ${msg}`;
        
        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: text,
            parse_mode: 'Markdown'
          })
        })
        .then(response => {
          if (!response.ok) throw new Error('Network response error');
          return response.json();
        })
        .then(data => {
          status.style.display = 'block';
          status.style.backgroundColor = '#dcfce7';
          status.style.color = '#15803d';
          status.innerText = 'تم إرسال رسالتك بنجاح! ✅';
          document.getElementById('telegramForm').reset();
        })
        .catch(error => {
          status.style.display = 'block';
          status.style.backgroundColor = '#fee2e2';
          status.style.color = '#b91c1c';
          status.innerText = 'حدث خطأ أثناء الإرسال، حاول مرة أخرى ❌';
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerText = 'إرسال الرسالة 🚀';
          btn.style.opacity = '1';
        });
      });
    </script>
